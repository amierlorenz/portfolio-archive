<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Archive · Amier Davis</title>
<meta name="description" content="Every version of my portfolio site, oldest to newest.">
<style>
  :root {
    --bar-bg: rgba(18, 18, 20, 0.82);
    --bar-border: rgba(255, 255, 255, 0.12);
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --hover: rgba(255, 255, 255, 0.1);
    --accent: #7dd3fc;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
  body { font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }

  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  /* Floating toolbar */
  .bar {
    position: fixed; z-index: 10;
    left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px;
    padding: 5px;
    max-width: calc(100vw - 32px);
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    transition: transform .25s ease, opacity .25s ease;
  }
  .bar.collapsed { transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none; }

  button, a.btn {
    appearance: none; border: 0; background: transparent; color: var(--text);
    font: inherit; cursor: pointer; text-decoration: none;
    height: 38px; min-width: 38px; padding: 0 10px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover, a.btn:hover { background: var(--hover); }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .3; cursor: default; background: transparent; }
  svg { width: 18px; height: 18px; flex: none; }

  .current { padding: 0 14px; min-width: 0; }
  .current .label { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; text-align: left; }
  .current .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
  .current .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .current .chev { opacity: .6; width: 14px; height: 14px; transition: transform .2s; }
  .current[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .sep { width: 1px; height: 22px; background: var(--bar-border); margin: 0 3px; }

  /* Version menu */
  .menu {
    position: fixed; z-index: 11;
    left: 50%; bottom: calc(72px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(6px);
    width: min(360px, calc(100vw - 32px));
    padding: 6px;
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .menu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
  .menu h2 { margin: 6px 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .menu ol { list-style: none; margin: 0; padding: 0; }
  .menu li button {
    width: 100%; height: auto; padding: 10px 12px; border-radius: 12px;
    justify-content: flex-start; text-align: left; gap: 12px;
  }
  .menu .num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.08); color: var(--muted);
  }
  .menu li button[aria-current="true"] { background: rgba(125, 211, 252, .12); }
  .menu li button[aria-current="true"] .num { background: var(--accent); color: #0b0b0c; }
  .menu .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .menu .meta strong { font-weight: 600; }
  .menu .meta span { color: var(--muted); font-size: 12px; }

  /* Re-open handle when the bar is hidden */
  .handle {
    position: fixed; z-index: 10;
    right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 44px; height: 44px;
    background: var(--bar-bg); border: 1px solid var(--bar-border); box-shadow: var(--shadow);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    opacity: 0; pointer-events: none; transform: scale(.8);
    transition: opacity .2s ease, transform .2s ease;
  }
  .handle.show { opacity: 1; pointer-events: auto; transform: none; }

  @media (max-width: 480px) {
    .hide-sm { display: none; }
    .current { padding: 0 8px; }
    .current .name { max-width: 46vw; }
  }
</style>
</head>
<body>
  <iframe id="frame" title="Portfolio version"></iframe>

  <div class="menu" id="menu" role="dialog" aria-label="Choose a version">
    <h2>Versions, oldest first</h2>
    <ol id="list"></ol>
  </div>

  <nav class="bar" id="bar" aria-label="Version switcher">
    <button id="prev" aria-label="Previous version" title="Previous (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="current" id="current" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu">
      <span class="label"><span class="name" id="name"></span><span class="date" id="date"></span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button id="next" aria-label="Next version" title="Next (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <span class="sep"></span>
    <a class="btn hide-sm" id="open" target="_blank" rel="noopener" aria-label="Open this version in a new tab" title="Open in new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
    <button id="hide" aria-label="Hide toolbar" title="Hide toolbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </nav>

  <button class="handle" id="handle" aria-label="Show version switcher" title="Show version switcher">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>
  </button>

<script>
  // Oldest first. Add new versions to the end.
  const versions = [
    { id: "2025-09", name: "First portfolio", date: "September 2025", stack: "HTML · CSS", path: "sites/2025-09-first-site/" },
    { id: "2025-12", name: "React portfolio", date: "October–December 2025", stack: "React · Vite · Figma", path: "sites/2025-12-react-site/" },
  ];

  const $ = (id) => document.getElementById(id);
  const frame = $("frame"), menu = $("menu"), list = $("list"), bar = $("bar"), handle = $("handle"), current = $("current");
  let index = 0;

  versions.forEach((v, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button data-i="${i}"><span class="num">${i + 1}</span><span class="meta"><strong>${v.name}</strong><span>${v.date} · ${v.stack}</span></span></button>`;
    li.firstChild.addEventListener("click", () => { show(i); toggleMenu(false); });
    list.appendChild(li);
  });

  function show(i, replace) {
    index = Math.max(0, Math.min(versions.length - 1, i));
    const v = versions[index];
    frame.src = v.path;
    $("name").textContent = `${index + 1}/${versions.length} · ${v.name}`;
    $("date").textContent = v.date;
    $("open").href = v.path;
    $("prev").disabled = index === 0;
    $("next").disabled = index === versions.length - 1;
    document.title = `${v.name} · Portfolio Archive`;
    list.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", j === index));
    const hash = "#" + v.id;
    if (location.hash !== hash) history[replace ? "replaceState" : "pushState"](null, "", hash);
  }

  function fromHash() {
    const i = versions.findIndex((v) => "#" + v.id === location.hash);
    show(i === -1 ? 0 : i, true);
  }

  function toggleMenu(open = !menu.classList.contains("open")) {
    menu.classList.toggle("open", open);
    current.setAttribute("aria-expanded", open);
  }

  function setHidden(hidden) {
    toggleMenu(false);
    bar.classList.toggle("collapsed", hidden);
    handle.classList.toggle("show", hidden);
  }

  $("prev").addEventListener("click", () => show(index - 1));
  $("next").addEventListener("click", () => show(index + 1));
  current.addEventListener("click", () => toggleMenu());
  $("hide").addEventListener("click", () => setHidden(true));
  handle.addEventListener("click", () => setHidden(false));
  window.addEventListener("popstate", fromHash);

  // Clicking into the site closes the menu (iframe steals focus).
  window.addEventListener("blur", () => toggleMenu(false));
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && !current.contains(e.target)) toggleMenu(false);
  });

  // Arrow keys switch versions, even while the site has focus (same origin).
  function onKey(e) {
    if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return;
    if (e.key === "ArrowLeft") show(index - 1);
    else if (e.key === "ArrowRight") show(index + 1);
    else if (e.key === "Escape") toggleMenu(false);
  }
  document.addEventListener("keydown", onKey);
  frame.addEventListener("load", () => {
    try { frame.contentDocument.addEventListener("keydown", onKey); } catch (_) {}
  });

  fromHash();
</script>
</body>
</html>
